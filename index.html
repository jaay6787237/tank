<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Tank Warfare - Retro Arcade</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Font: Chakra Petch -->
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: #080a0f;
            color: #f3f4f6;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        canvas#gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }
        /* Custom retro scanline effect overlay */
        .scanlines {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        /* Custom styling for HUD elements */
        .hud-panel {
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid rgba(0, 255, 170, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.15), inset 0 0 10px rgba(0, 255, 170, 0.05);
            backdrop-filter: blur(4px);
        }
        .btn-arcade {
            background: linear-gradient(180deg, #10b981 0%, #047857 100%);
            border: 2px solid #34d399;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
            transition: all 0.15s ease-in-out;
        }
        .btn-arcade:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
            filter: brightness(1.1);
        }
        .btn-arcade:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
        }
        /* Crosshair canvas overlay */
        #crosshair {
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
        }
        /* Mobile Touch Button Styles */
        .touch-btn {
            touch-action: none;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none">

    <!-- WebGL Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Scanline Visual Overlay -->
    <div class="scanlines absolute inset-0 z-10 pointer-events-none"></div>

    <!-- 2D Aim Reticle Canvas -->
    <canvas id="crosshair" class="w-full h-full"></canvas>

    <!-- TOP HUD OVERLAY -->
    <div id="hud" class="absolute top-4 left-4 right-4 z-20 flex justify-between items-start pointer-events-none">
        <!-- Player Status (Health, Armor, Score) -->
        <div class="hud-panel p-4 rounded-xl max-w-xs w-full">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs uppercase tracking-widest text-emerald-400 font-bold">Tank Hull Integrity</span>
                <span id="hpText" class="text-sm font-bold text-white">100%</span>
            </div>
            <!-- Health Bar Container -->
            <div class="w-full bg-gray-800 h-3 rounded-full overflow-hidden border border-gray-700 p-0.5">
                <div id="hpBar" class="bg-gradient-to-r from-emerald-500 to-green-400 h-full rounded-full transition-all duration-300 w-full"></div>
            </div>
            <div class="grid grid-cols-2 gap-2 mt-3 text-xs">
                <div class="bg-gray-900/60 p-2 rounded border border-gray-800">
                    <div class="text-gray-400 text-[10px]">SCORE</div>
                    <div id="scoreVal" class="text-emerald-400 font-mono font-bold text-base">0000</div>
                </div>
                <div class="bg-gray-900/60 p-2 rounded border border-gray-800">
                    <div class="text-gray-400 text-[10px]">KILLS</div>
                    <div id="killsVal" class="text-red-400 font-mono font-bold text-base">0</div>
                </div>
            </div>
        </div>

        <!-- Radar Minimap & Wave Info -->
        <div class="hud-panel p-3 rounded-xl flex items-center gap-3">
            <div class="text-right">
                <div id="waveVal" class="text-emerald-400 font-bold text-sm tracking-wider">WAVE 1</div>
                <div id="enemiesLeftVal" class="text-xs text-gray-300 mt-1">Hostiles: <span class="text-red-400 font-bold">0</span></div>
            </div>
            <canvas id="minimap" width="120" height="120" class="rounded-lg border border-emerald-500/40 bg-gray-950/80"></canvas>
        </div>
    </div>

    <!-- CONTROLS GUIDANCE BANNER (Hidden on mobile) -->
    <div id="controlsBanner" class="hidden md:flex absolute bottom-4 left-1/2 -translate-x-1/2 z-20 pointer-events-none hud-panel px-6 py-2 rounded-full text-xs text-gray-300 items-center gap-6 border-gray-700">
        <div class="flex items-center gap-2"><span class="px-2 py-0.5 bg-gray-800 border border-gray-600 rounded text-emerald-400 font-mono font-bold">W A S D</span> Move Tank</div>
        <div class="flex items-center gap-2"><span class="px-2 py-0.5 bg-gray-800 border border-gray-600 rounded text-emerald-400 font-mono font-bold">MOUSE</span> Aim Turret</div>
        <div class="flex items-center gap-2"><span class="px-2 py-0.5 bg-gray-800 border border-gray-600 rounded text-emerald-400 font-mono font-bold">L-CLICK / SPACE</span> Fire Cannon</div>
    </div>

    <!-- MOBILE ON-SCREEN TOUCH CONTROLS -->
    <div id="mobileControls" class="absolute bottom-3 left-3 right-3 z-20 flex justify-between items-end pointer-events-none select-none">
        <!-- Left: Chassis Directional D-Pad -->
        <div class="pointer-events-auto flex flex-col items-center gap-1.5 bg-gray-900/70 p-2 rounded-2xl border border-emerald-500/30 backdrop-blur-md">
            <button id="btnUp" class="touch-btn w-12 h-12 md:w-14 md:h-14 bg-emerald-600/70 hover:bg-emerald-500 active:bg-emerald-400 border border-emerald-400/50 rounded-xl text-white font-bold text-xl flex items-center justify-center shadow-lg active:scale-90 transition-all">▲</button>
            <div class="flex gap-1.5">
                <button id="btnLeft" class="touch-btn w-12 h-12 md:w-14 md:h-14 bg-emerald-600/70 hover:bg-emerald-500 active:bg-emerald-400 border border-emerald-400/50 rounded-xl text-white font-bold text-xl flex items-center justify-center shadow-lg active:scale-90 transition-all">◄</button>
                <button id="btnDown" class="touch-btn w-12 h-12 md:w-14 md:h-14 bg-emerald-600/70 hover:bg-emerald-500 active:bg-emerald-400 border border-emerald-400/50 rounded-xl text-white font-bold text-xl flex items-center justify-center shadow-lg active:scale-90 transition-all">▼</button>
                <button id="btnRight" class="touch-btn w-12 h-12 md:w-14 md:h-14 bg-emerald-600/70 hover:bg-emerald-500 active:bg-emerald-400 border border-emerald-400/50 rounded-xl text-white font-bold text-xl flex items-center justify-center shadow-lg active:scale-90 transition-all">►</button>
            </div>
        </div>

        <!-- Right: Turret Aim & Fire Controls -->
        <div class="pointer-events-auto flex items-end gap-2 bg-gray-900/70 p-2 rounded-2xl border border-emerald-500/30 backdrop-blur-md">
            <div class="flex flex-col gap-1 items-center">
                <span class="text-[9px] uppercase tracking-wider text-cyan-400 font-bold">Turret</span>
                <div class="flex gap-1.5">
                    <button id="btnTurretLeft" class="touch-btn w-11 h-11 md:w-12 md:h-12 bg-cyan-600/70 active:bg-cyan-400 border border-cyan-400/50 rounded-xl text-white font-bold text-lg flex items-center justify-center shadow-lg active:scale-90 transition-all">↺</button>
                    <button id="btnTurretRight" class="touch-btn w-11 h-11 md:w-12 md:h-12 bg-cyan-600/70 active:bg-cyan-400 border border-cyan-400/50 rounded-xl text-white font-bold text-lg flex items-center justify-center shadow-lg active:scale-90 transition-all">↻</button>
                </div>
            </div>

            <!-- Main Fire Cannon Button -->
            <button id="btnFire" class="touch-btn w-16 h-16 md:w-20 md:h-20 bg-gradient-to-br from-red-500 to-rose-700 active:from-red-400 active:to-rose-600 border-2 border-red-400 rounded-2xl text-white font-black text-xs md:text-sm flex flex-col items-center justify-center shadow-red-900/60 shadow-xl active:scale-90 transition-all ml-1">
                <span class="text-xl md:text-2xl">💥</span>
                <span>TEMBAK</span>
            </button>
        </div>
    </div>

    <!-- START / RESTART SCREEN OVERLAY -->
    <div id="modalOverlay" class="absolute inset-0 z-30 flex items-center justify-center bg-black/80 backdrop-blur-md transition-opacity duration-300">
        <div class="hud-panel p-8 rounded-2xl max-w-md w-full mx-4 text-center border-emerald-500/40 shadow-2xl relative overflow-hidden">
            <!-- Decorative Accent line -->
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-emerald-500 via-cyan-400 to-emerald-500"></div>

            <div class="mb-6">
                <h1 id="modalTitle" class="text-4xl font-black italic tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-200 to-cyan-400 uppercase">
                    3D TANK WARFARE
                </h1>
                <p id="modalSubtitle" class="text-xs text-gray-400 tracking-widest uppercase mt-2">Retro Low-Poly Combat Simulator</p>
            </div>

            <div id="modalStats" class="hidden mb-6 bg-gray-900/80 p-4 rounded-xl border border-gray-800 text-left text-sm space-y-2">
                <div class="flex justify-between"><span class="text-gray-400">Waves Survived:</span><span id="statWaves" class="font-bold text-cyan-400">0</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Total Kills:</span><span id="statKills" class="font-bold text-red-400">0</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Final Score:</span><span id="statScore" class="font-bold text-yellow-400">0</span></div>
            </div>

            <button id="startBtn" class="btn-arcade w-full py-3.5 px-6 rounded-xl font-bold text-lg text-white tracking-wider uppercase cursor-pointer">
                ENGAGE BATTLE
            </button>
        </div>
    </div>

    <!-- GAME LOGIC SCRIPT -->
    <script>
        /**
         * CLASSIC 3D TANK WARFARE GAME ENGINE
         * Built using Three.js, Web Audio API, and Vanilla JS
         */

        // --- GLOBAL SOUND SYNTHESIZER (Web Audio API) ---
        class AudioSynth {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } else if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playShoot() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.25);
                    
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.25);
                } catch (e) {
                    console.warn('Audio playback inhibited:', e);
                }
            }
            playExplosion() {
                if (!this.ctx) return;
                try {
                    const bufferSize = this.ctx.sampleRate * 0.4;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }

                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(300, this.ctx.currentTime);
                    filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.4);

                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);

                    noise.start();
                    noise.stop(this.ctx.currentTime + 0.4);
                } catch (e) {
                    console.warn('Audio playback inhibited:', e);
                }
            }
            playHit() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.1);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.1);
                } catch (e) {
                    console.warn('Audio playback inhibited:', e);
                }
            }
        }

        const audioSynth = new AudioSynth();

        // --- GAME CONSTANTS & GLOBALS ---
        const MAP_SIZE = 120;
        const GRID_CELL = 8;
        const TANK_RADIUS = 2.2;

        let scene, camera, renderer, raycaster, mousePlane;
        let mouse = new THREE.Vector2();
        let mouseWorldPos = new THREE.Vector3();

        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let kills = 0;
        let currentWave = 1;

        let playerTank;
        let enemies = [];
        let projectiles = [];
        let particles = [];
        let obstacles = []; // Wall boundaries & destructible crates
        let obstacleBoxes = []; // THREE.Box3 for collision check

        // Key states
        const keys = { w: false, a: false, s: false, d: false, space: false };

        // Touch / Mobile control state
        const touchKeys = { w: false, a: false, s: false, d: false, turretLeft: false, turretRight: false };

        // DOM Elements
        const canvas = document.getElementById('gameCanvas');
        const crosshairCanvas = document.getElementById('crosshair');
        const crosshairCtx = crosshairCanvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimap');
        const minimapCtx = minimapCanvas.getContext('2d');

        const hpBar = document.getElementById('hpBar');
        const hpText = document.getElementById('hpText');
        const scoreVal = document.getElementById('scoreVal');
        const killsVal = document.getElementById('killsVal');
        const waveVal = document.getElementById('waveVal');
        const enemiesLeftVal = document.getElementById('enemiesLeftVal');

        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalSubtitle = document.getElementById('modalSubtitle');
        const modalStats = document.getElementById('modalStats');
        const startBtn = document.getElementById('startBtn');

        // --- PROCEDURAL 3D TANK CREATOR ---
        function createTankMesh(colorHex, isPlayer = false) {
            const tankGroup = new THREE.Group();

            // Materials
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: colorHex,
                roughness: 0.4,
                metalness: 0.3,
                flatShading: true
            });
            const darkMaterial = new THREE.MeshStandardMaterial({
                color: 0x1f2937,
                roughness: 0.8,
                metalness: 0.1,
                flatShading: true
            });
            const accentMaterial = new THREE.MeshStandardMaterial({
                color: isPlayer ? 0x10b981 : 0xef4444,
                emissive: isPlayer ? 0x059669 : 0x991b1b,
                emissiveIntensity: 0.3,
                flatShading: true
            });

            // 1. Chassis / Body Base
            const bodyGeo = new THREE.BoxGeometry(3.2, 1.1, 4.2);
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMaterial);
            bodyMesh.position.y = 0.9;
            bodyMesh.castShadow = true;
            bodyMesh.receiveShadow = true;
            tankGroup.add(bodyMesh);

            // Front Slope Accent
            const slopeGeo = new THREE.BoxGeometry(2.8, 0.4, 1.2);
            const slopeMesh = new THREE.Mesh(slopeGeo, accentMaterial);
            slopeMesh.position.set(0, 1.2, -1.5);
            slopeMesh.rotation.x = -0.3;
            tankGroup.add(slopeMesh);

            // 2. Treads (Left & Right)
            const treadGeo = new THREE.BoxGeometry(0.7, 0.9, 4.6);
            const leftTread = new THREE.Mesh(treadGeo, darkMaterial);
            leftTread.position.set(-1.8, 0.65, 0);
            leftTread.castShadow = true;
            tankGroup.add(leftTread);

            const rightTread = leftTread.clone();
            rightTread.position.x = 1.8;
            tankGroup.add(rightTread);

            // Wheels details on treads
            for (let z = -1.8; z <= 1.8; z += 0.9) {
                const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.75, 8);
                wheelGeo.rotateZ(Math.PI / 2);
                
                const wL = new THREE.Mesh(wheelGeo, darkMaterial);
                wL.position.set(-1.8, 0.5, z);
                tankGroup.add(wL);

                const wR = new THREE.Mesh(wheelGeo, darkMaterial);
                wR.position.set(1.8, 0.5, z);
                tankGroup.add(wR);
            }

            // 3. Turret Assembly (Rotates around Y)
            const turretGroup = new THREE.Group();
            turretGroup.position.set(0, 1.5, 0);

            const turretGeo = new THREE.CylinderGeometry(1.3, 1.5, 0.8, 8);
            const turretMesh = new THREE.Mesh(turretGeo, bodyMaterial);
            turretMesh.castShadow = true;
            turretGroup.add(turretMesh);

            // Hatch on Turret
            const hatchGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.2, 8);
            const hatchMesh = new THREE.Mesh(hatchGeo, darkMaterial);
            hatchMesh.position.set(0.4, 0.5, 0.2);
            turretGroup.add(hatchMesh);

            // 4. Cannon Barrel
            const barrelGeo = new THREE.CylinderGeometry(0.18, 0.22, 2.8, 8);
            barrelGeo.rotateX(-Math.PI / 2);
            const barrelMesh = new THREE.Mesh(barrelGeo, darkMaterial);
            barrelMesh.position.set(0, 0.1, -1.8);
            barrelMesh.castShadow = true;
            turretGroup.add(barrelMesh);

            // Muzzle Break Tip
            const muzzleGeo = new THREE.CylinderGeometry(0.26, 0.26, 0.5, 8);
            muzzleGeo.rotateX(-Math.PI / 2);
            const muzzleMesh = new THREE.Mesh(muzzleGeo, accentMaterial);
            muzzleMesh.position.set(0, 0.1, -3.1);
            turretGroup.add(muzzleMesh);

            // Tip Point marker for firing shells
            const firePoint = new THREE.Object3D();
            firePoint.position.set(0, 0.1, -3.5);
            turretGroup.add(firePoint);

            tankGroup.add(turretGroup);

            return {
                mesh: tankGroup,
                turret: turretGroup,
                firePoint: firePoint
            };
        }

        // --- TANK LOGIC CLASS ---
        class Tank {
            constructor(x, z, colorHex, isPlayer = false) {
                this.isPlayer = isPlayer;
                const tankData = createTankMesh(colorHex, isPlayer);
                this.mesh = tankData.mesh;
                this.turret = tankData.turret;
                this.firePoint = tankData.firePoint;

                this.mesh.position.set(x, 0, z);
                scene.add(this.mesh);

                this.maxHp = isPlayer ? 100 : 40;
                this.hp = this.maxHp;
                this.speed = isPlayer ? 0.28 : 0.14;
                this.turnSpeed = 0.045;
                this.cooldown = 0;
                this.maxCooldown = isPlayer ? 18 : 60; // frames between shots

                this.velocity = new THREE.Vector3();
                this.rotationAngle = 0;
            }

            update() {
                if (this.cooldown > 0) this.cooldown--;
            }

            shoot() {
                if (this.cooldown > 0) return false;
                this.cooldown = this.maxCooldown;

                // Calculate fire position & direction vector
                const worldFirePos = new THREE.Vector3();
                this.firePoint.getWorldPosition(worldFirePos);

                const dir = new THREE.Vector3(0, 0, -1);
                dir.applyQuaternion(this.turret.getWorldQuaternion(new THREE.Quaternion()));

                // Create Shell Projectile
                projectiles.push(new Projectile(worldFirePos, dir, this.isPlayer));

                // Muzzle Flash Effect
                createMuzzleFlash(worldFirePos);

                // Recoil animation quick kick
                this.turret.position.z += 0.25;

                audioSynth.playShoot();
                return true;
            }

            takeDamage(amount) {
                this.hp -= amount;
                if (this.hp < 0) this.hp = 0;
                audioSynth.playHit();

                // Spark Particles on hit
                createExplosion(this.mesh.position.x, 1.5, this.mesh.position.z, 0xffa500, 10, 0.3);

                if (this.isPlayer) {
                    updatePlayerHUD();
                }
            }

            destroy() {
                scene.remove(this.mesh);
                createExplosion(this.mesh.position.x, 1.5, this.mesh.position.z, 0xff4400, 40, 0.8);
                audioSynth.playExplosion();
            }
        }

        // --- PROJECTILE CLASS ---
        class Projectile {
            constructor(pos, dir, isPlayer) {
                this.isPlayer = isPlayer;
                this.speed = 1.1;
                this.life = 120; // 2 seconds life max
                this.radius = 0.4;

                this.velocity = dir.clone().multiplyScalar(this.speed);

                // Low-poly Glowing Shell Mesh
                const geo = new THREE.SphereGeometry(this.radius, 6, 6);
                const mat = new THREE.MeshBasicMaterial({
                    color: isPlayer ? 0x34d399 : 0xf87171
                });
                this.mesh = new THREE.Mesh(geo, mat);
                this.mesh.position.copy(pos);

                // Add small light source to projectile
                const light = new THREE.PointLight(isPlayer ? 0x10b981 : 0xef4444, 2, 8);
                this.mesh.add(light);

                scene.add(this.mesh);
            }

            update() {
                this.mesh.position.add(this.velocity);
                this.life--;

                // Smoke trail particles
                if (Math.random() < 0.6) {
                    particles.push(new SmokeParticle(this.mesh.position, 0.2));
                }

                return this.life > 0;
            }

            destroy() {
                scene.remove(this.mesh);
            }
        }

        // --- PARTICLE EFFECTS ---
        class Particle {
            constructor(pos, color, scale, speedFactor) {
                const geo = new THREE.BoxGeometry(scale, scale, scale);
                const mat = new THREE.MeshBasicMaterial({ color: color });
                this.mesh = new THREE.Mesh(geo, mat);
                this.mesh.position.copy(pos);

                this.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * speedFactor,
                    (Math.random() * 0.5 + 0.2) * speedFactor,
                    (Math.random() - 0.5) * speedFactor
                );

                this.gravity = 0.015;
                this.life = 20 + Math.random() * 20;
                this.maxLife = this.life;

                scene.add(this.mesh);
            }

            update() {
                this.velocity.y -= this.gravity;
                this.mesh.position.add(this.velocity);
                this.mesh.rotation.x += 0.1;
                this.mesh.rotation.y += 0.1;

                this.life--;
                const scaleProgress = this.life / this.maxLife;
                this.mesh.scale.setScalar(Math.max(0.01, scaleProgress));

                return this.life > 0;
            }

            destroy() {
                scene.remove(this.mesh);
            }
        }

        class SmokeParticle {
            constructor(pos, scale) {
                const geo = new THREE.BoxGeometry(scale, scale, scale);
                const mat = new THREE.MeshBasicMaterial({
                    color: 0x6b7280,
                    transparent: true,
                    opacity: 0.6
                });
                this.mesh = new THREE.Mesh(geo, mat);
                this.mesh.position.copy(pos);

                this.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.05,
                    Math.random() * 0.04 + 0.02,
                    (Math.random() - 0.5) * 0.05
                );

                this.life = 15 + Math.random() * 10;
                this.maxLife = this.life;

                scene.add(this.mesh);
            }

            update() {
                this.mesh.position.add(this.velocity);
                this.life--;
                this.mesh.material.opacity = (this.life / this.maxLife) * 0.5;
                return this.life > 0;
            }

            destroy() {
                scene.remove(this.mesh);
            }
        }

        function createExplosion(x, y, z, colorHex, count, scale = 0.5) {
            const pos = new THREE.Vector3(x, y, z);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(pos, colorHex, (Math.random() * 0.4 + 0.2) * scale, 0.6 * scale));
            }
        }

        function createMuzzleFlash(pos) {
            const flashLight = new THREE.PointLight(0xffaa00, 5, 10);
            flashLight.position.copy(pos);
            scene.add(flashLight);
            setTimeout(() => scene.remove(flashLight), 50);
        }

        // --- ENVIRONMENT & MAP GENERATOR ---
        function createMapEnvironment() {
            // Ground Mesh with Dynamic Canvas Grid Texture
            const gridCanvas = document.createElement('canvas');
            gridCanvas.width = 128;
            gridCanvas.height = 128;
            const gCtx = gridCanvas.getContext('2d');
            gCtx.fillStyle = '#111827';
            gCtx.fillRect(0, 0, 128, 128);
            gCtx.strokeStyle = '#1f2937';
            gCtx.lineWidth = 4;
            gCtx.strokeRect(0, 0, 128, 128);

            const groundTexture = new THREE.CanvasTexture(gridCanvas);
            groundTexture.wrapS = THREE.RepeatWrapping;
            groundTexture.wrapT = THREE.RepeatWrapping;
            groundTexture.repeat.set(MAP_SIZE / 8, MAP_SIZE / 8);

            const groundGeo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE);
            const groundMat = new THREE.MeshStandardMaterial({
                map: groundTexture,
                roughness: 0.9,
                metalness: 0.1
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Invisible Ground Plane for Raycasting Turret Mouse Target
            const mousePlaneGeo = new THREE.PlaneGeometry(MAP_SIZE * 2, MAP_SIZE * 2);
            mousePlane = new THREE.Mesh(mousePlaneGeo, new THREE.MeshBasicMaterial({ visible: false }));
            mousePlane.rotation.x = -Math.PI / 2;
            mousePlane.position.y = 1.5; // align with turret height
            scene.add(mousePlane);

            // Outer Arena Perimeter Walls
            const wallHeight = 4;
            const wallThickness = 2;
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 0.6, flatShading: true });

            const halfMap = MAP_SIZE / 2;
            const wallConfigs = [
                { w: MAP_SIZE, h: wallHeight, d: wallThickness, x: 0, z: -halfMap },
                { w: MAP_SIZE, h: wallHeight, d: wallThickness, x: 0, z: halfMap },
                { w: wallThickness, h: wallHeight, d: MAP_SIZE, x: -halfMap, z: 0 },
                { w: wallThickness, h: wallHeight, d: MAP_SIZE, x: halfMap, z: 0 }
            ];

            wallConfigs.forEach(cfg => {
                const geo = new THREE.BoxGeometry(cfg.w, cfg.h, cfg.d);
                const mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(cfg.x, cfg.h / 2, cfg.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);

                const box = new THREE.Box3().setFromObject(mesh);
                obstacles.push({ mesh, box, destructible: false });
                obstacleBoxes.push(box);
            });

            // Random Inner Map Obstacles (Indestructible Concrete Pillars & Destructible Crates)
            const obstacleMat = new THREE.MeshStandardMaterial({ color: 0x4b5563, roughness: 0.5, flatShading: true });
            const crateMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.7, flatShading: true });

            const gridSpan = Math.floor(MAP_SIZE / GRID_CELL) - 4;

            for (let x = -gridSpan / 2; x <= gridSpan / 2; x++) {
                for (let z = -gridSpan / 2; z <= gridSpan / 2; z++) {
                    // Leave center clear for player spawn
                    if (Math.abs(x) <= 2 && Math.abs(z) <= 2) continue;

                    if (Math.random() < 0.18) {
                        const posX = x * GRID_CELL;
                        const posZ = z * GRID_CELL;

                        const isCrate = Math.random() < 0.4;
                        const size = isCrate ? 3.5 : 4.5;
                        const height = isCrate ? 3.5 : 5;

                        const geo = new THREE.BoxGeometry(size, height, size);
                        const mesh = new THREE.Mesh(geo, isCrate ? crateMat : obstacleMat);
                        mesh.position.set(posX, height / 2, posZ);
                        mesh.castShadow = true;
                        mesh.receiveShadow = true;
                        scene.add(mesh);

                        const box = new THREE.Box3().setFromObject(mesh);
                        obstacles.push({
                            mesh: mesh,
                            box: box,
                            destructible: isCrate,
                            hp: isCrate ? 20 : 9999
                        });
                        obstacleBoxes.push(box);
                    }
                }
            }
        }

        // --- ENEMY AI MANAGER ---
        function spawnEnemyWave(waveNum) {
            const enemyCount = 2 + waveNum * 2;
            const spawnRadius = MAP_SIZE / 2 - 10;

            for (let i = 0; i < enemyCount; i++) {
                let validSpawn = false;
                let x = 0, z = 0;
                let attempts = 0;

                while (!validSpawn && attempts < 50) {
                    attempts++;
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 25 + Math.random() * (spawnRadius - 25);
                    x = Math.cos(angle) * dist;
                    z = Math.sin(angle) * dist;

                    // Check distance from player
                    if (playerTank && playerTank.mesh) {
                        const pPos = playerTank.mesh.position;
                        if (Math.hypot(x - pPos.x, z - pPos.z) < 20) continue;
                    }

                    // Check collision with obstacles
                    const testBox = new THREE.Box3(
                        new THREE.Vector3(x - 2, 0, z - 2),
                        new THREE.Vector3(x + 2, 4, z + 2)
                    );

                    let hitObs = false;
                    for (let obs of obstacleBoxes) {
                        if (obs.intersectsBox(testBox)) {
                            hitObs = true;
                            break;
                        }
                    }
                    if (!hitObs) validSpawn = true;
                }

                if (validSpawn) {
                    const enemy = new Tank(x, z, 0xd97706, false);
                    // Scale stats based on wave
                    enemy.speed = 0.1 + Math.min(waveNum * 0.02, 0.12);
                    enemies.push(enemy);
                }
            }
            updatePlayerHUD();
        }

        function updateEnemyAI() {
            if (!playerTank || gameState !== 'PLAYING') return;

            const playerPos = playerTank.mesh.position;

            enemies.forEach(enemy => {
                enemy.update();

                const enemyPos = enemy.mesh.position;
                const distToPlayer = enemyPos.distanceTo(playerPos);

                // Global turret rotation towards player
                const targetTurretAngle = Math.atan2(
                    -(playerPos.x - enemyPos.x),
                    -(playerPos.z - enemyPos.z)
                ) - enemy.rotationAngle;

                enemy.turret.rotation.y = THREE.MathUtils.lerp(enemy.turret.rotation.y, targetTurretAngle, 0.08);

                // Movement AI (Approach if far, rotate towards player)
                if (distToPlayer > 12) {
                    // Turn chassis towards player
                    const desiredChassisAngle = Math.atan2(playerPos.x - enemyPos.x, playerPos.z - enemyPos.z);
                    let diff = desiredChassisAngle - enemy.rotationAngle;

                    // Normalize angle
                    diff = Math.atan2(Math.sin(diff), Math.cos(diff));

                    if (Math.abs(diff) > 0.1) {
                        enemy.rotationAngle += Math.sign(diff) * enemy.turnSpeed;
                        enemy.mesh.rotation.y = enemy.rotationAngle;
                    }

                    // Move forward with collision checks
                    const moveStep = enemy.speed;
                    const nextX = enemyPos.x + Math.sin(enemy.rotationAngle) * moveStep;
                    const nextZ = enemyPos.z + Math.cos(enemy.rotationAngle) * moveStep;

                    if (!checkTankCollision(nextX, nextZ, enemy)) {
                        enemyPos.x = nextX;
                        enemyPos.z = nextZ;
                    }
                }

                // Shooting Logic
                if (distToPlayer < 45) {
                    enemy.shoot();
                }
            });
        }

        // --- COLLISION DETECTION SYSTEM ---
        function checkTankCollision(x, z, currentTank) {
            // World Boundary Collision
            const halfLimit = MAP_SIZE / 2 - 3;
            if (Math.abs(x) > halfLimit || Math.abs(z) > halfLimit) return true;

            const tankBox = new THREE.Box3(
                new THREE.Vector3(x - TANK_RADIUS, 0, z - TANK_RADIUS),
                new THREE.Vector3(x + TANK_RADIUS, 3, z + TANK_RADIUS)
            );

            // Obstacle Collisions
            for (let obs of obstacles) {
                if (obs.box.intersectsBox(tankBox)) return true;
            }

            // Tank vs Tank Collisions
            if (currentTank !== playerTank && playerTank) {
                const pPos = playerTank.mesh.position;
                if (Math.hypot(x - pPos.x, z - pPos.z) < TANK_RADIUS * 2) return true;
            }

            for (let other of enemies) {
                if (other !== currentTank) {
                    const oPos = other.mesh.position;
                    if (Math.hypot(x - oPos.x, z - oPos.z) < TANK_RADIUS * 2) return true;
                }
            }

            return false;
        }

        function updateProjectiles() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                const active = p.update();

                if (!active) {
                    p.destroy();
                    projectiles.splice(i, 1);
                    continue;
                }

                const pPos = p.mesh.position;

                // 1. Boundary Hit
                const halfLimit = MAP_SIZE / 2 - 1;
                if (Math.abs(pPos.x) > halfLimit || Math.abs(pPos.z) > halfLimit) {
                    createExplosion(pPos.x, pPos.y, pPos.z, 0x9ca3af, 12, 0.4);
                    p.destroy();
                    projectiles.splice(i, 1);
                    continue;
                }

                // 2. Obstacle Hits
                let hitObstacle = false;
                for (let j = obstacles.length - 1; j >= 0; j--) {
                    const obs = obstacles[j];
                    if (obs.box.containsPoint(pPos)) {
                        createExplosion(pPos.x, pPos.y, pPos.z, 0x9ca3af, 15, 0.4);
                        hitObstacle = true;

                        // Destructible crate damage
                        if (obs.destructible) {
                            obs.hp -= 10;
                            if (obs.hp <= 0) {
                                scene.remove(obs.mesh);
                                createExplosion(obs.mesh.position.x, 1.5, obs.mesh.position.z, 0xd97706, 25, 0.7);
                                audioSynth.playExplosion();

                                // Remove obstacle box reference
                                const bIdx = obstacleBoxes.indexOf(obs.box);
                                if (bIdx > -1) obstacleBoxes.splice(bIdx, 1);
                                obstacles.splice(j, 1);
                            }
                        }
                        break;
                    }
                }

                if (hitObstacle) {
                    p.destroy();
                    projectiles.splice(i, 1);
                    continue;
                }

                // 3. Player Hit (By Enemy Shell)
                if (!p.isPlayer && playerTank) {
                    if (pPos.distanceTo(playerTank.mesh.position) < TANK_RADIUS) {
                        playerTank.takeDamage(15);
                        p.destroy();
                        projectiles.splice(i, 1);

                        if (playerTank.hp <= 0) {
                            handleGameOver();
                        }
                        continue;
                    }
                }

                // 4. Enemy Hit (By Player Shell)
                if (p.isPlayer) {
                    let enemyHitIndex = -1;
                    for (let e = 0; e < enemies.length; e++) {
                        const enemy = enemies[e];
                        if (pPos.distanceTo(enemy.mesh.position) < TANK_RADIUS) {
                            enemy.takeDamage(20);
                            enemyHitIndex = e;
                            break;
                        }
                    }

                    if (enemyHitIndex !== -1) {
                        p.destroy();
                        projectiles.splice(i, 1);

                        const hitEnemy = enemies[enemyHitIndex];
                        if (hitEnemy.hp <= 0) {
                            hitEnemy.destroy();
                            enemies.splice(enemyHitIndex, 1);
                            score += 100;
                            kills++;
                            updatePlayerHUD();

                            // Wave Cleared Check
                            if (enemies.length === 0) {
                                currentWave++;
                                score += 250;
                                setTimeout(() => {
                                    if (gameState === 'PLAYING') spawnEnemyWave(currentWave);
                                }, 1500);
                            }
                        }
                        continue;
                    }
                }
            }
        }

        // --- PLAYER CONTROLS & CAMERA ---
        function updatePlayerControls() {
            if (!playerTank || gameState !== 'PLAYING') return;

            playerTank.update();

            // Smooth Turret Recoil Return
            if (playerTank.turret.position.z > 0) {
                playerTank.turret.position.z -= 0.03;
                if (playerTank.turret.position.z < 0) playerTank.turret.position.z = 0;
            }

            // Chassis Movement Logic (Keyboard + Mobile Touch)
            let moveSpeed = 0;
            const isForward = keys.w || touchKeys.w;
            const isBackward = keys.s || touchKeys.s;

            if (isForward) moveSpeed = playerTank.speed;
            if (isBackward) moveSpeed = -playerTank.speed * 0.6;

            if (keys.a || touchKeys.a) {
                playerTank.rotationAngle += playerTank.turnSpeed * (isBackward ? -1 : 1);
            }
            if (keys.d || touchKeys.d) {
                playerTank.rotationAngle -= playerTank.turnSpeed * (isBackward ? -1 : 1);
            }

            playerTank.mesh.rotation.y = playerTank.rotationAngle;

            // Manual Turret Rotation via Touch Buttons
            if (touchKeys.turretLeft) {
                playerTank.turret.rotation.y += 0.04;
            }
            if (touchKeys.turretRight) {
                playerTank.turret.rotation.y -= 0.04;
            }

            if (moveSpeed !== 0) {
                const nextX = playerTank.mesh.position.x + Math.sin(playerTank.rotationAngle) * moveSpeed;
                const nextZ = playerTank.mesh.position.z + Math.cos(playerTank.rotationAngle) * moveSpeed;

                if (!checkTankCollision(nextX, nextZ, playerTank)) {
                    playerTank.mesh.position.x = nextX;
                    playerTank.mesh.position.z = nextZ;

                    // Dust particles when moving
                    if (Math.random() < 0.3) {
                        particles.push(new SmokeParticle(playerTank.mesh.position, 0.3));
                    }
                }
            }

            // Turret Raycast Aiming (Mouse or Touch-drag)
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(mousePlane);

            if (intersects.length > 0 && !touchKeys.turretLeft && !touchKeys.turretRight) {
                mouseWorldPos.copy(intersects[0].point);

                // Convert world aim point to tank relative angle
                const dx = mouseWorldPos.x - playerTank.mesh.position.x;
                const dz = mouseWorldPos.z - playerTank.mesh.position.z;

                // World angle from tank to mouse
                const worldAimAngle = Math.atan2(-dx, -dz);

                // Local angle relative to tank body rotation
                playerTank.turret.rotation.y = worldAimAngle - playerTank.rotationAngle;
            }

            // Smooth Third-Person Camera Tracking
            const camOffset = new THREE.Vector3(0, 18, 22);
            const targetCamPos = playerTank.mesh.position.clone().add(camOffset);
            camera.position.lerp(targetCamPos, 0.08);
            camera.lookAt(playerTank.mesh.position.clone().add(new THREE.Vector3(0, 1, -2)));
        }

        // --- 2D MINIMAP & CROSSHAIR HUD RENDERERS ---
        function renderMinimap() {
            if (!minimapCtx) return;
            minimapCtx.clearRect(0, 0, 120, 120);

            const scale = 120 / MAP_SIZE;
            const center = 60;

            // Draw Obstacles
            minimapCtx.fillStyle = '#4b5563';
            obstacles.forEach(obs => {
                const x = obs.mesh.position.x * scale + center;
                const z = obs.mesh.position.z * scale + center;
                minimapCtx.fillRect(x - 2, z - 2, 4, 4);
            });

            // Draw Enemies
            minimapCtx.fillStyle = '#ef4444';
            enemies.forEach(e => {
                const x = e.mesh.position.x * scale + center;
                const z = e.mesh.position.z * scale + center;
                minimapCtx.beginPath();
                minimapCtx.arc(x, z, 3, 0, Math.PI * 2);
                minimapCtx.fill();
            });

            // Draw Player
            if (playerTank) {
                const px = playerTank.mesh.position.x * scale + center;
                const pz = playerTank.mesh.position.z * scale + center;
                minimapCtx.fillStyle = '#10b981';
                minimapCtx.beginPath();
                minimapCtx.arc(px, pz, 4, 0, Math.PI * 2);
                minimapCtx.fill();

                // Facing direction line
                minimapCtx.strokeStyle = '#34d399';
                minimapCtx.lineWidth = 1.5;
                minimapCtx.beginPath();
                minimapCtx.moveTo(px, pz);
                minimapCtx.lineTo(
                    px + Math.sin(playerTank.rotationAngle) * 8,
                    pz + Math.cos(playerTank.rotationAngle) * 8
                );
                minimapCtx.stroke();
            }
        }

        function renderCrosshair() {
            if (!crosshairCtx) return;
            crosshairCtx.clearRect(0, 0, crosshairCanvas.width, crosshairCanvas.height);

            if (gameState !== 'PLAYING') return;

            // Convert mouse normalized coords to screen pixels
            const sx = (mouse.x * 0.5 + 0.5) * crosshairCanvas.width;
            const sy = (-mouse.y * 0.5 + 0.5) * crosshairCanvas.height;

            crosshairCtx.strokeStyle = '#10b981';
            crosshairCtx.lineWidth = 2;

            // Reticle outer ring
            crosshairCtx.beginPath();
            crosshairCtx.arc(sx, sy, 12, 0, Math.PI * 2);
            crosshairCtx.stroke();

            // Center dot
            crosshairCtx.fillStyle = '#34d399';
            crosshairCtx.beginPath();
            crosshairCtx.arc(sx, sy, 2, 0, Math.PI * 2);
            crosshairCtx.fill();

            // Crosshair lines
            crosshairCtx.beginPath();
            crosshairCtx.moveTo(sx - 18, sy); crosshairCtx.lineTo(sx - 8, sy);
            crosshairCtx.moveTo(sx + 8, sy); crosshairCtx.lineTo(sx + 18, sy);
            crosshairCtx.moveTo(sx, sy - 18); crosshairCtx.lineTo(sx, sy - 8);
            crosshairCtx.moveTo(sx, sy + 8); crosshairCtx.lineTo(sx, sy + 18);
            crosshairCtx.stroke();
        }

        // --- HUD UPDATER ---
        function updatePlayerHUD() {
            if (!playerTank) return;

            const hpPercent = Math.max(0, Math.round((playerTank.hp / playerTank.maxHp) * 100));
            hpText.textContent = `${hpPercent}%`;
            hpBar.style.width = `${hpPercent}%`;

            if (hpPercent < 30) {
                hpBar.className = "bg-gradient-to-r from-red-600 to-red-400 h-full rounded-full transition-all duration-300 animate-pulse";
            } else if (hpPercent < 60) {
                hpBar.className = "bg-gradient-to-r from-yellow-500 to-amber-400 h-full rounded-full transition-all duration-300";
            } else {
                hpBar.className = "bg-gradient-to-r from-emerald-500 to-green-400 h-full rounded-full transition-all duration-300";
            }

            scoreVal.textContent = String(score).padStart(4, '0');
            killsVal.textContent = kills;
            waveVal.textContent = `WAVE ${currentWave}`;
            enemiesLeftVal.querySelector('span').textContent = enemies.length;
        }

        // --- GAME LOOP & INITIALIZATION ---
        function initScene() {
            // Three.js Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x080a0f);
            scene.fog = new THREE.FogExp2(0x080a0f, 0.012);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 300);
            camera.position.set(0, 20, 25);

            // WebGL Renderer Setup
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            raycaster = new THREE.Raycaster();

            // Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff7ed, 1.2);
            sunLight.position.set(40, 60, 20);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 150;
            const d = 60;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // Fill Light
            const fillLight = new THREE.DirectionalLight(0x3b82f6, 0.4);
            fillLight.position.set(-30, 20, -30);
            scene.add(fillLight);

            // Build Environment Map
            createMapEnvironment();

            // Mobile Touch Control Bindings
            bindTouchControls();

            // Resize Listeners
            onWindowResize();
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
            window.addEventListener('mousedown', onMouseDown);

            // Touch aim on canvas
            window.addEventListener('touchstart', handleTouchAim, { passive: false });
            window.addEventListener('touchmove', handleTouchAim, { passive: false });
        }

        // --- MOBILE TOUCH CONTROLS BINDER ---
        function bindTouchControl(elementId, keyName, isAction = false) {
            const btn = document.getElementById(elementId);
            if (!btn) return;

            function handleStart(e) {
                if (e.cancelable) e.preventDefault();
                if (isAction) {
                    if (gameState === 'PLAYING' && playerTank) {
                        playerTank.shoot();
                    }
                } else {
                    touchKeys[keyName] = true;
                }
                btn.classList.add('scale-90', 'ring-2', 'ring-emerald-400');
            }

            function handleEnd(e) {
                if (e.cancelable) e.preventDefault();
                if (!isAction) {
                    touchKeys[keyName] = false;
                }
                btn.classList.remove('scale-90', 'ring-2', 'ring-emerald-400');
            }

            btn.addEventListener('pointerdown', handleStart);
            btn.addEventListener('pointerup', handleEnd);
            btn.addEventListener('pointercancel', handleEnd);
            btn.addEventListener('touchstart', (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
        }

        function bindTouchControls() {
            bindTouchControl('btnUp', 'w');
            bindTouchControl('btnDown', 's');
            bindTouchControl('btnLeft', 'a');
            bindTouchControl('btnRight', 'd');
            bindTouchControl('btnTurretLeft', 'turretLeft');
            bindTouchControl('btnTurretRight', 'turretRight');
            bindTouchControl('btnFire', null, true);
        }

        function handleTouchAim(e) {
            if (e.touches && e.touches.length > 0) {
                const touch = e.touches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                // Only aim if touch is not over control buttons
                if (!target || !target.closest('.touch-btn')) {
                    if (e.cancelable) e.preventDefault();
                    mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
                }
            }
        }

        function startNewGame() {
            audioSynth.init();

            // Clear old entities
            if (playerTank) playerTank.destroy();
            enemies.forEach(e => e.destroy());
            enemies = [];
            projectiles.forEach(p => p.destroy());
            projectiles = [];
            particles.forEach(pt => pt.destroy());
            particles = [];

            score = 0;
            kills = 0;
            currentWave = 1;

            // Spawn Player Tank
            playerTank = new Tank(0, 0, 0x059669, true);

            // Spawn Initial Wave
            spawnEnemyWave(currentWave);

            gameState = 'PLAYING';
            modalOverlay.classList.add('opacity-0', 'pointer-events-none');
            updatePlayerHUD();
        }

        function handleGameOver() {
            gameState = 'GAMEOVER';

            modalTitle.textContent = "MISSION FAILED";
            modalTitle.className = "text-4xl font-black italic tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-rose-300 to-red-600 uppercase";
            modalSubtitle.textContent = "Your tank was destroyed in combat";

            document.getElementById('statWaves').textContent = currentWave;
            document.getElementById('statKills').textContent = kills;
            document.getElementById('statScore').textContent = score;
            modalStats.classList.remove('hidden');

            startBtn.textContent = "REDEPLOY TANK";
            modalOverlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        // --- EVENT HANDLERS ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);

            crosshairCanvas.width = window.innerWidth;
            crosshairCanvas.height = window.innerHeight;
        }

        function onMouseMove(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        function onMouseDown(e) {
            if (gameState === 'PLAYING' && e.button === 0 && playerTank) {
                playerTank.shoot();
            }
        }

        function onKeyDown(e) {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'arrowup') keys.w = true;
            if (key === 's' || key === 'arrowdown') keys.s = true;
            if (key === 'a' || key === 'arrowleft') keys.a = true;
            if (key === 'd' || key === 'arrowright') keys.d = true;

            if (e.code === 'Space') {
                keys.space = true;
                if (gameState === 'PLAYING' && playerTank) playerTank.shoot();
            }
        }

        function onKeyUp(e) {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'arrowup') keys.w = false;
            if (key === 's' || key === 'arrowdown') keys.s = false;
            if (key === 'a' || key === 'arrowleft') keys.a = false;
            if (key === 'd' || key === 'arrowright') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        }

        startBtn.addEventListener('click', startNewGame);

        // --- MAIN ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (gameState === 'PLAYING') {
                updatePlayerControls();
                updateEnemyAI();
                updateProjectiles();

                // Particle Updates
                for (let i = particles.length - 1; i >= 0; i--) {
                    if (!particles[i].update()) {
                        particles[i].destroy();
                        particles.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
            renderCrosshair();
            renderMinimap();
        }

        // Start Application on Load
        window.onload = () => {
            initScene();
            animate();
        };
    </script>
</body>
</html>
